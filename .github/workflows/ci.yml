name: CI

on:
  push:
    branches: [main, work/**]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
      # stacks-03: runneri mici / lxc-ci-worker — limitează OOM la build Nx/Next
      NODE_OPTIONS: '--max-old-space-size=6144'
      # Nx Cloud opțional — doar din GitHub Secrets; niciodată în log (fără echo secrets)
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lockfile SHA256 (audit reproducibilitate)
        run: python3 tools/ci/gates/lockfile_hash_echo.py >> "$GITHUB_STEP_SUMMARY"

      - name: Sync TS references
        run: pnpm exec nx sync

      - name: Stack gates (Python)
        run: python3 tools/ci/run_gates.py

      - name: CI tools smoke (Python unittest)
        run: python3 -m unittest tools.ci.test_gates_smoke -v

      - name: Lint (affected sau tot)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec nx affected -t lint --base=origin/${{ github.base_ref }} --head=HEAD --parallel=3
          else
            pnpm exec nx run-many -t lint --all --parallel=3
          fi

      - name: Typecheck (affected pe PR, altfel tot)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec nx affected -t typecheck --base=origin/${{ github.base_ref }} --head=HEAD --parallel=3
          else
            pnpm exec nx run-many -t typecheck --all --parallel=3
          fi

      - name: Build (affected sau tot)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec nx affected -t build --base=origin/${{ github.base_ref }} --head=HEAD --parallel=3 --projects=api,web,@cerniq/llm,@cerniq/messaging
          else
            pnpm exec nx run-many -t build --projects=api,web,@cerniq/llm,@cerniq/messaging --parallel=3
          fi

      - name: Unit tests (Jest)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec nx affected -t test --base=origin/${{ github.base_ref }} --head=HEAD --parallel=3
          else
            pnpm exec nx run-many -t test --all --parallel=3
          fi

      - name: Generator unit tests (Python)
        run: python3 -m unittest discover -s tools/generators -p 'test_*.py' -v

      - name: Build Storybook (web)
        run: pnpm --filter web exec storybook build -o ../../dist/storybook-web
        continue-on-error: false

      - name: Install Playwright system deps (Chromium)
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: E2E (Chromium, CI)
        env:
          CI: 'true'
        run: pnpm exec nx run web-e2e:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web-e2e/playwright-report
          if-no-files-found: ignore
