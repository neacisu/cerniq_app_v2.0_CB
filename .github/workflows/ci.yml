name: CI

on:
  push:
    branches: [main, work/**]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync TS references
        run: pnpm exec nx sync

      - name: Lint
        run: pnpm exec nx run-many -t lint --all

      - name: Build
        run: pnpm exec nx run-many -t build --projects=api,web

      - name: Unit tests (Jest)
        run: pnpm exec nx run-many -t test --all

      - name: Generator unit tests (Python)
        run: python3 -m unittest discover -s tools/generators -p 'test_*.py' -v

      - name: Install Playwright system deps (Chromium)
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: E2E (Chromium, CI)
        env:
          CI: 'true'
        run: pnpm exec nx run web-e2e:e2e
