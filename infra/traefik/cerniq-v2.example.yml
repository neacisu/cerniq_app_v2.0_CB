# Fragment de referință Traefik (fișier dinamic sau labels) — NU înlocuiește /opt/traefik live.
# Host: orchestrator 77.42.76.185 :443 (stacks-02). Upstream: 127.0.0.1:25000 / :25010 / :25012

http:
  routers:
    cerniq-v2-web:
      rule: Host(`v2.cerniq.app`)
      service: cerniq-v2-web-svc
      entryPoints:
        - websecure
      tls: {}
    cerniq-v2-api:
      rule: Host(`api.v2.cerniq.app`)
      service: cerniq-v2-api-svc
      entryPoints:
        - websecure
      tls: {}
  services:
    cerniq-v2-web-svc:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:25000
    cerniq-v2-api-svc:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:25010
