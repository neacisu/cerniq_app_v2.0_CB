<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cerniq.app — CognitiveBrain V2</title>
  <link rel="stylesheet" href="tokens.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="overview.jsx"></script>
  <script type="text/babel" src="live.jsx"></script>
  <script type="text/babel" src="gateways.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    /* ── Tweaks defaults ── */
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "light",
      "accentHue": 130,
      "density": "spacious",
      "motionLevel": "full",
      "railExpanded": false
    }/*EDITMODE-END*/;

    /* ── Tweaks Panel ── */
    const TweaksPanel = ({ tweaks, setTweaks, visible }) => {
      if (!visible) return null;
      const update = (key, val) => {
        const next = { ...tweaks, [key]: val };
        setTweaks(next);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
      };

      const tweaksPanelStyles = {
        position: 'fixed', bottom: 16, right: 16, width: 260, zIndex: 200,
        background: 'var(--bg-glass-dense)', backdropFilter: 'blur(var(--blur-heavy))',
        border: '1px solid var(--border-subtle)', borderRadius: 'var(--r-lg)',
        padding: 'var(--sp-4)', display: 'flex', flexDirection: 'column', gap: 'var(--sp-4)',
        boxShadow: 'var(--depth-3)', animation: 'fadeIn var(--dur-soft) var(--ease-fluid)',
      };

      const labelStyle = { fontSize: 'var(--text-xs)', color: 'var(--text-tertiary)', textTransform: 'uppercase', letterSpacing: '0.5px', fontWeight: 600, fontFamily: 'var(--font-body)', marginBottom: 4 };

      return (
        <div style={tweaksPanelStyles}>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 'var(--text-sm)', fontWeight: 600, color: 'var(--text-primary)' }}>Tweaks</div>

          <div>
            <div style={labelStyle}>Theme</div>
            <SegmentedControl options={[{ value: 'dark', label: 'Dark' }, { value: 'light', label: 'Light' }]}
              value={tweaks.theme} onChange={v => update('theme', v)} style={{ width: '100%' }} />
          </div>

          <div>
            <div style={labelStyle}>Accent Hue</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-2)' }}>
              <input type="range" min="0" max="360" step="5" value={tweaks.accentHue}
                onChange={e => update('accentHue', Number(e.target.value))}
                style={{ flex: 1, accentColor: `oklch(0.78 0.14 ${tweaks.accentHue})` }} />
              <div style={{ width: 18, height: 18, borderRadius: 'var(--r-full)', background: `oklch(0.78 0.14 ${tweaks.accentHue})`, border: '1px solid var(--border-hairline)' }} />
            </div>
          </div>

          <div>
            <div style={labelStyle}>Density</div>
            <SegmentedControl options={[{ value: 'compact', label: 'Compact' }, { value: 'dense', label: 'Dense' }, { value: 'spacious', label: 'Spacious' }]}
              value={tweaks.density} onChange={v => update('density', v)} style={{ width: '100%' }} />
          </div>

          <div>
            <div style={labelStyle}>Motion</div>
            <SegmentedControl options={[{ value: 'none', label: 'Off' }, { value: 'reduced', label: 'Reduced' }, { value: 'full', label: 'Full' }]}
              value={tweaks.motionLevel} onChange={v => update('motionLevel', v)} style={{ width: '100%' }} />
          </div>
        </div>
      );
    };

    /* ── Main App ── */
    const CerniqApp = () => {
      const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
      const [tweaksVisible, setTweaksVisible] = useState(false);
      const [page, setPage] = useState(() => localStorage.getItem('cerniq-page') || 'overview');
      const [railOpen, setRailOpen] = useState(TWEAK_DEFAULTS.railExpanded);

      // Apply theme
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', tweaks.theme);
      }, [tweaks.theme]);

      // Apply accent hue
      useEffect(() => {
        const hue = tweaks.accentHue;
        const r = document.documentElement;
        r.style.setProperty('--accent', `oklch(0.78 0.14 ${hue})`);
        r.style.setProperty('--accent-dim', `oklch(0.60 0.10 ${hue})`);
        r.style.setProperty('--accent-bg', `oklch(0.78 0.14 ${hue} / 0.12)`);
        r.style.setProperty('--accent-text', `oklch(0.85 0.12 ${hue})`);
      }, [tweaks.accentHue]);

      // Apply motion
      useEffect(() => {
        if (tweaks.motionLevel === 'none') {
          document.documentElement.style.setProperty('--dur-fast', '0ms');
          document.documentElement.style.setProperty('--dur-base', '0ms');
          document.documentElement.style.setProperty('--dur-soft', '0ms');
          document.documentElement.style.setProperty('--dur-fluid', '0ms');
        } else if (tweaks.motionLevel === 'reduced') {
          document.documentElement.style.setProperty('--dur-fast', '60ms');
          document.documentElement.style.setProperty('--dur-base', '90ms');
          document.documentElement.style.setProperty('--dur-soft', '120ms');
          document.documentElement.style.setProperty('--dur-fluid', '160ms');
        } else {
          document.documentElement.style.removeProperty('--dur-fast');
          document.documentElement.style.removeProperty('--dur-base');
          document.documentElement.style.removeProperty('--dur-soft');
          document.documentElement.style.removeProperty('--dur-fluid');
        }
      }, [tweaks.motionLevel]);

      // Persist page
      const go = useCallback((p) => { setPage(p); localStorage.setItem('cerniq-page', p); }, []);

      // Tweaks edit mode protocol
      useEffect(() => {
        const handler = (e) => {
          if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
          if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
        };
        window.addEventListener('message', handler);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', handler);
      }, []);

      // Render page
      const renderPage = () => {
        switch (page) {
          case 'overview': return <OverviewPage />;
          case 'live': return <LivePage />;
          case 'gateways': return <GatewaysIndex />;
          case 'gateway-detail': return <GatewayDetail />;
          default: return <PlaceholderPage name={page} />;
        }
      };

      return (
        <ThemeCtx.Provider value={{ theme: tweaks.theme, toggle: () => setTweaks(t => ({ ...t, theme: t.theme === 'dark' ? 'light' : 'dark' })) }}>
        <NavCtx.Provider value={{ page, go, railOpen, toggleRail: () => setRailOpen(o => !o) }}>
        <CmdCtx.Provider value={{ open: false, setOpen: () => {} }}>
          <CmdPaletteWrapper>
            <AppShell>{renderPage()}</AppShell>
            <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVisible} />
          </CmdPaletteWrapper>
        </CmdCtx.Provider>
        </NavCtx.Provider>
        </ThemeCtx.Provider>
      );
    };

    /* Wrap CmdCtx properly */
    const CmdPaletteWrapper = ({ children }) => {
      const [open, setOpen] = useState(false);
      return (
        <CmdCtx.Provider value={{ open, setOpen }}>
          {children}
        </CmdCtx.Provider>
      );
    };

    /* Placeholder for unbuilt pages */
    const PlaceholderPage = ({ name }) => (
      <div style={{
        display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
        height: '100%', gap: 'var(--sp-4)', color: 'var(--text-tertiary)',
      }}>
        <div style={{ width: 80, height: 80, borderRadius: 'var(--r-xl)', background: 'var(--bg-raised)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '32px', border: '1px solid var(--border-hairline)' }}>
          {NAV_ITEMS.find(n => n.id === name)?.icon || '◇'}
        </div>
        <div style={{ fontFamily: 'var(--font-display)', fontSize: 'var(--text-xl)', fontWeight: 600, color: 'var(--text-primary)', textTransform: 'capitalize' }}>{name}</div>
        <div style={{ fontSize: 'var(--text-sm)', color: 'var(--text-tertiary)' }}>Coming in Sprint 4–5</div>
      </div>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<CerniqApp />);
  </script>
</body>
</html>
