<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0e17" media="(prefers-color-scheme: dark)">
<meta name="description" content="Registrul firmelor din România: date ANAF, ONRC și situații financiare 2008–2025.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Firme Cerniq — registrul firmelor din România</title>
<script>
try{var s=JSON.parse(localStorage.getItem('firme.settings')||'{}');var t=s.theme||'auto';
var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
