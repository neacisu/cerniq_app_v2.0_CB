worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  gzip on; gzip_comp_level 6; gzip_min_length 1024; gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=grup:10m rate=3r/s;
  limit_req_zone $binary_remote_addr zone=lista:10m rate=10r/s;
  limit_req_status 429;

  server {
    # Ascultă doar pe gateway-ul rețelei traefik_default, ca portul să nu fie expus pe internet.
    listen 172.18.0.1:4187;
    server_name firme.cerniq.app;
    root /usr/share/nginx/html;
    index index.html;
    set_real_ip_from 172.18.0.0/16;
    real_ip_header X-Forwarded-For;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-ISbPGQ7h+r8JKUg9rVqisu7B1Viv9pICVZcnbZ3UzTg='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # API de citire (Fastify pe loopback). Doar GET/HEAD.
    location /api/ {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://127.0.0.1:4186/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 20s;
      proxy_hide_header Server;
      add_header Cache-Control "private, max-age=60" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Rute servite de instanța API cu extensiile (firme-api-ext) pe 127.0.0.1:4197.
    # Graful parcurge tabela de reprezentanți (interogări mai grele): limită strictă.
    location ~ ^/api/grup(/|$) {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      limit_req zone=grup burst=6 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://127.0.0.1:4197;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 20s;
      proxy_hide_header Server;
      add_header Cache-Control "private, max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
    }
    # Stare fiscală ANAF v9 și dosare: interogări indexate, folosite și în liste (căutare, graf, comparare).
    location ~ ^/api/(anaf|dosare)(/|$) {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      limit_req zone=lista burst=30 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://127.0.0.1:4197;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 20s;
      proxy_hide_header Server;
      add_header Cache-Control "private, max-age=120" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
    }
    location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-ISbPGQ7h+r8JKUg9rVqisu7B1Viv9pICVZcnbZ3UzTg='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always; }
    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-ISbPGQ7h+r8JKUg9rVqisu7B1Viv9pICVZcnbZ3UzTg='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
  }
}
