# firme-web: nginx cu rețea host, legat doar pe gateway-ul traefik_default (172.18.0.1:4187).
# Traefik rutează firme.cerniq.app către el (vezi traefik-firme-web.yml); /api/ este proxy către 127.0.0.1:4186.
services:
  firme-web:
    image: nginx:1.28.0-alpine
    container_name: firme-web
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/firme-web/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/firme-web/dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://172.18.0.1:4187/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
